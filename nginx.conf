    # Bare /best index has no page — send crawlers to the AI tools hub
    location = /best { return 301 /hub/ai-tools; }
    location = /best/ { return 301 /hub/ai-tools; }

    # Directory stubs crawled as 404 in GSC → nearest real landing page
    location = /vs { return 301 /compare; }
    location = /vs/ { return 301 /compare; }
    location = /tool { return 301 /tools; }
    location = /tool/ { return 301 /tools; }
    location = /recipes { return 301 /workflows; }
    location = /recipes/ { return 301 /workflows; }
    location = /scores { return 301 /scoring-hub; }
    location = /scores/ { return 301 /scoring-hub; }
    location = /report { return 301 /report/state-of-saas-trust-2026; }
    location = /report/ { return 301 /report/state-of-saas-trust-2026; }

    # Reverse /vs/ order → canonical pair direction (stops 404.html noindex)
    location = /vs/todoist-vs-clickup { return 301 /vs/clickup-vs-todoist; }
    location = /vs/asana-vs-clickup { return 301 /vs/clickup-vs-asana; }
    location = /vs/notion-vs-clickup { return 301 /vs/clickup-vs-notion; }
    location = /vs/asana-vs-todoist { return 301 /vs/todoist-vs-asana; }
    location = /vs/notion-vs-todoist { return 301 /vs/todoist-vs-notion; }
    location = /vs/notion-vs-asana { return 301 /vs/asana-vs-notion; }
    location = /vs/confluence-vs-notion { return 301 /vs/notion-vs-confluence; }
    location = /vs/discord-vs-slack { return 301 /vs/slack-vs-discord; }
    location = /vs/teams-vs-slack { return 301 /vs/slack-vs-teams; }
    location = /vs/make-vs-zapier { return 301 /vs/zapier-vs-make; }
    location = /vs/discord-vs-teams { return 301 /vs/teams-vs-discord; }
    location = /vs/clickup-vs-confluence { return 301 /vs/confluence-vs-clickup; }
    location = /vs/grammarly-vs-prowritingaid { return 301 /vs/prowritingaid-vs-grammarly; }
    location = /vs/zapier-vs-clickup { return 301 /vs/clickup-vs-zapier; }
    location = /vs/make-vs-clickup { return 301 /vs/clickup-vs-make; }
    location = /vs/canva-vs-todoist { return 301 /vs/todoist-vs-canva; }
    location = /vs/github-vs-todoist { return 301 /vs/todoist-vs-github; }
    location = /vs/grammarly-vs-todoist { return 301 /vs/todoist-vs-grammarly; }
    location = /vs/confluence-vs-todoist { return 301 /vs/todoist-vs-confluence; }
    location = /vs/prowritingaid-vs-todoist { return 301 /vs/todoist-vs-prowritingaid; }
    location = /vs/canva-vs-asana { return 301 /vs/asana-vs-canva; }
    location = /vs/github-vs-asana { return 301 /vs/asana-vs-github; }
    location = /vs/grammarly-vs-asana { return 301 /vs/asana-vs-grammarly; }
    location = /vs/confluence-vs-asana { return 301 /vs/asana-vs-confluence; }
    location = /vs/prowritingaid-vs-asana { return 301 /vs/asana-vs-prowritingaid; }
    location = /vs/canva-vs-notion { return 301 /vs/notion-vs-canva; }
    location = /vs/github-vs-notion { return 301 /vs/notion-vs-github; }
    location = /vs/grammarly-vs-notion { return 301 /vs/notion-vs-grammarly; }
    location = /vs/prowritingaid-vs-notion { return 301 /vs/notion-vs-prowritingaid; }
    location = /vs/github-vs-canva { return 301 /vs/canva-vs-github; }
    location = /vs/grammarly-vs-canva { return 301 /vs/canva-vs-grammarly; }
    location = /vs/confluence-vs-canva { return 301 /vs/canva-vs-confluence; }
    location = /vs/prowritingaid-vs-canva { return 301 /vs/canva-vs-prowritingaid; }
    location = /vs/grammarly-vs-github { return 301 /vs/github-vs-grammarly; }
    location = /vs/confluence-vs-github { return 301 /vs/github-vs-confluence; }
    location = /vs/prowritingaid-vs-github { return 301 /vs/github-vs-prowritingaid; }
    location = /vs/confluence-vs-grammarly { return 301 /vs/grammarly-vs-confluence; }
    location = /vs/prowritingaid-vs-confluence { return 301 /vs/confluence-vs-prowritingaid; }

    # ── Canonical alias redirects (301) ─────────────────────────────────
    # These /tools/* paths duplicate root-level v2.0 canonical routes.
    # 301 redirect preserves SEO equity and resolves duplicate canonical issues.
    # /tools/compare is excluded — it has CSP frame-ancestors * for embed support.
    location = /tools/stack-builder { return 301 /stack-builder; }
    location = /tools/tco-calculator { return 301 /tco-calculator; }
    location = /tools/vendor-risk-checker { return 301 /vendor-risk-checker; }
    location = /tools/workflow-blueprint { return 301 /workflow-blueprint; }
    location = /tools/stack-quiz { return 301 /stack-quiz; }
    # Orphan short aliases discovered in GSC (not the full *-checker / stack-* names)
    location = /tools/vendor-risk { return 301 /vendor-risk-checker; }
    location = /tools/quiz { return 301 /stack-quiz; }

    # SEO-1.3: legacy underscore hub URLs → hyphenated canonical hubs (301, permanent).
    # These were double-indexed alongside the hyphenated versions; the redirects
    # consolidate their signals into one URL per hub. Mirrored client-side in Hub.tsx.
    location = /hub/ai_workflow { return 301 /hub/ai-workflow; }
    location = /hub/intelligent_home { return 301 /hub/intelligent-home; }
    location = /hub/hybrid_office { return 301 /hub/hybrid-office; }

    # Legacy/CMS probe paths: avoid repeated 4XX by redirecting to homepage.
    location = /wp-admin/ { return 301 /; }
    location = /wp-login.php { return 301 /; }

    # Legacy hub route migration (/hubs/:slug -> /hub/:slug)
    location ~ ^/hubs/([^/]+)/?$ {
        return 301 /hub/$1;
    }

    # Blog articles — serve prerendered HTML; missing slugs return real 404
    # (stops soft-404 from SPA shell). New articles must be in the build.
    location ^~ /blog/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;


    }
    location = /blog {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Hub pages — prerendered hubs 404 if missing; keeps SPA for /hub index edge cases
    location ^~ /hub/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;


    }
    location = /hub {
        return 301 /hubs;
    }

    # Product detail pages — prefer prerendered HTML; SPA fallback only for
    # Convex-only slugs not present in the static catalog build.
    location ^~ /products/ {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;


    }
    location = /products {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # SaaS tool reviews — prerendered; unknown tool slugs → hard 404 (not soft)
    location ^~ /tool/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;


    }

    # Compare widget embed — iframe OK, never index (canonical is /compare)
    location ^~ /tools/compare {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers-embed.inc;

        add_header X-Robots-Tag "noindex, follow" always;


    }

    location ^~ /tools/embed {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers-embed.inc;

        add_header X-Robots-Tag "noindex, follow" always;


    }

    # Widget/embed iframe pages — allow framing, never index
    location ^~ /widget/ {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers-embed.inc;

        add_header X-Robots-Tag "noindex, follow" always;


    }

    # Hashed assets: long cache. Safe because Vite's filenames change on every build
    # (index-Ct49O5DH.js → index-<newhash>.js), so a given hash is never rewritten.
    # MISSING files must 404 here (no SPA fallback) — falling through to /index.html
    # would return HTML with 200 and break the module loader instead of failing fast.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Sitemap and robots: short cache
    location ~* ^/(sitemap\.xml|robots\.txt)$ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # ── AI API Proxy (server-side, avoids browser CORS) ─────────────────
    # The browser calls /api/ai/chat/completions on the same origin; nginx forwards to NVIDIA.
    # The API key is injected from the server env var (not exposed to browser).
    # NOTE: $NVIDIA_API_KEY is substituted at container startup by envsubst
    # with a whitelist ('$NVIDIA_API_KEY') so nginx's own $variables like
    # $request_uri, $uri, etc. are NOT corrupted.
    location /api/ai/ {
        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        # Strip /api/ai/ prefix and proxy to NVIDIA's OpenAI-compatible endpoint.
        # Client calls /api/ai/chat/completions → proxy_pass to /v1/chat/completions
        rewrite ^/api/ai/(.*)$ /v1/$1 break;
        proxy_pass https://integrate.api.nvidia.com;
        proxy_set_header Host integrate.api.nvidia.com;
        # Inject the NVIDIA API key at the server level (not exposed to browser)
        # This $NVIDIA_API_KEY is substituted by envsubst at startup — it is NOT
        # an nginx variable, so nginx will never try to parse it.
        proxy_set_header Authorization "Bearer $NVIDIA_API_KEY";
        proxy_set_header Content-Type application/json;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_ssl_server_name on;
        # Avoid leaking upstream 5xx as crawlable HTML errors for bots hitting /api/*
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @api_unavailable;
        # CORS for the actual response
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    location @api_unavailable {
        default_type application/json;
        add_header X-Robots-Tag "noindex, follow" always;
        return 503 '{"error":"ai_upstream_unavailable"}';
    }

    # Prerendered marketing routes — hard 404 if file missing (no homepage soft-404)
    location ~ ^/(decision-studio|scoring-hub|alternatives|about|contact|privacy|terms|disclosure|guides|glossary)/?$ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;


    }

    # /tools/* SPA sub-apps (roi calculator, etc.) — keep client fallback
    location ^~ /tools/ {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;

    }
    location = /tools {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # 404.html: return proper 404 status (stops soft-404 homepage shells).
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # Thin / private surfaces: keep out of the index even if linked.
    location = /my-stack {
        try_files $uri $uri/index.html /index.html;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location = /widgets {
        try_files $uri $uri/index.html /index.html;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location = /search {
        try_files $uri $uri/index.html /index.html;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
    # Client-routed prefixes that may lack a prerendered file for every param
    # (Convex-backed or auth screens). Keep SPA fallback here only.
    location ~ ^/(compare/|recipes/|forum|admin|auth|profile|settings|community|tasks|products/watchlist) {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;

    }

    # Homepage exact
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers-deny.inc;
    }

    # Default: serve prerendered HTML or hard 404 — never the homepage shell.
    # This is the primary fix for GSC "Soft 404" / "Crawled - currently not indexed".
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers-deny.inc;
    }
}
