    location = /products/blaze-ai/alternatives { return 301 /tool/blaze-ai/alternatives; }
    location = /products/lalal-ai/alternatives { return 301 /tool/lalal-ai/alternatives; }
    location = /products/magical-ai/alternatives { return 301 /tool/magical-ai/alternatives; }
    location = /products/mubert/alternatives { return 301 /tool/mubert/alternatives; }
    location = /products/murf-ai/alternatives { return 301 /tool/murf-ai/alternatives; }
    location = /products/opus-clip/alternatives { return 301 /tool/opus-clip/alternatives; }
    location = /products/play-ht/alternatives { return 301 /tool/play-ht/alternatives; }
    location = /products/remnote/alternatives { return 301 /tool/remnote/alternatives; }
    location = /products/slite/alternatives { return 301 /tool/slite/alternatives; }
    location = /products/superwhisper/alternatives { return 301 /tool/superwhisper/alternatives; }
    location = /products/syllaby/alternatives { return 301 /tool/syllaby/alternatives; }
    location = /products/tactiq/alternatives { return 301 /tool/tactiq/alternatives; }
    location = /products/taskade/alternatives { return 301 /tool/taskade/alternatives; }
    location = /products/textexpander/alternatives { return 301 /tool/textexpander/alternatives; }
