# PERF-005: compression and cache headers
# Embed routes: do NOT send X-Frame-Options SAMEORIGIN — it blocks third-party iframes and can
# leave the frame on chrome-error://chromewebdata/ with console "Unsafe attempt to load URL…".
# Use CSP frame-ancestors * only for public embed tools.
server {
    listen 80;
    server_name www.thesynlab.com;
    return 301 https://thesynlab.com$request_uri;
}

server {
    listen 80;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml image/webp image/avif;
    server_name thesynlab.com _;
    root /usr/share/nginx/html;
    index index.html;
    etag on;

    # ── Security headers ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;


    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # ad-slot.ts / AdsterraScript.tsx origins:
    #   AdSense loader + ad frames  → pagead2.googlesyndication.com, tpc.*, googleads.g.doubleclick.net
    #   Adsterra native + display banner + popunder → *.profitableratecpmnetwork.com,
    #                                                *.highperformanceformat.com
    # NOTE: `frame-src` must be explicit. Without it the policy falls back to
    # `default-src 'self'`, which silently blocks every ad frame — i.e. ads load, render
    # nothing, and revenue is zero with no build error.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://adservice.google.com https://*.profitableratecpmnetwork.com https://*.highperformanceformat.com https://*.clerk.accounts.dev https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://kindhearted-lark-661.convex.cloud wss://kindhearted-lark-661.convex.cloud https://www.google-analytics.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.profitableratecpmnetwork.com https://*.highperformanceformat.com https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://*.googlesyndication.com https://*.profitableratecpmnetwork.com https://*.highperformanceformat.com; frame-ancestors 'self' https://thesynlab.com; base-uri 'self'; form-action 'self'" always;

    # Single-hop HTTP → HTTPS redirect
    if ($http_x_forwarded_proto = "http") {
        return 301 https://thesynlab.com$request_uri;
    }

    # Always serve robots.txt with no restrictions.
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
        try_files $uri =404;
    }

    # Legacy CMS product-category paths → live roundup articles (301 consolidates
